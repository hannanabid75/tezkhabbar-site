backend:
  name: github
  repo: hannanabid75/tezkhabbar-site
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: sections
    label: Website Sections
    files:
      - name: daily
        label: Daily Newspapers
        file: data/daily.json
        fields:
          - label: Boxes
            name: boxes
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string, required: false}
              - {label: Date text, name: date, widget: string, required: false}
              - {label: JPG image, name: image, widget: image, required: false, choose_url: false}
      - name: politics
        label: Politics
        file: data/politics.json
        fields:
          - label: Boxes
            name: boxes
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string, required: false}
              - {label: Date text, name: date, widget: string, required: false}
              - {label: JPG image, name: image, widget: image, required: false, choose_url: false}
      - name: international
        label: International
        file: data/international.json
        fields:
          - label: Boxes
            name: boxes
            widget: list
            summary: "{{fields.title}}"
            fields:

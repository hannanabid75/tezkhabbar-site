<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TezKhabbar</title>
<link rel="icon" type="image/png" href="/image1.png">
<style>
:root{--bg:#f3f7ff;--card:#fff;--line:#d8e4f8;--blue:#1d5fe0;--text:#0b1b3a;--muted:#5b6f93}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(20,60,140,.06)}
.bar{width:min(1200px,94%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.logo img{height:48px;width:auto;border-radius:8px}
.logo b{display:block;letter-spacing:1px}
.logo small{color:var(--muted);letter-spacing:2px;font-size:.7rem}
.btn{display:inline-block;background:linear-gradient(135deg,#2f7bff,#1747b8);color:#fff;border:0;padding:10px 20px;border-radius:30px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
main{width:min(1200px,94%);margin:24px auto 50px}
h1{font-size:clamp(1.3rem,3vw,1.9rem)}
.date{color:var(--muted);margin:4px 0 16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.page{margin-bottom:22px}.plabel{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;color:var(--muted);font-size:.9rem}.plabel a{color:var(--blue);font-weight:600;text-decoration:none}.chip{min-width:40px;text-align:center;padding:8px 12px}
.stage{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,60,140,.1);padding:12px;overflow:auto;text-align:center}
.stage img{max-width:100%;height:auto;display:inline-block;cursor:zoom-in;border-radius:8px}
.stage.zoom img{max-width:none;cursor:zoom-out}
.msg{padding:40px;color:var(--muted);text-align:center}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 0 30px}
</style></head><body>
<header><div class="bar">
<a class="logo" href="/"><img src="/image3.jpg" alt="TezKhabbar"><span><b>TEZKHABBAR</b><small>PAKISTAN'S FAST NEWS</small></span></a>
<button class="btn alt" id="back" type="button">&larr; Back</button>
</div></header>
<main>
<h1 id="t"></h1><div class="date" id="d"></div>
<div class="actions" id="jump"><a class="btn alt" href="/">Home</a></div>
<div id="pages"><div class="msg" id="msg">Loading&hellip;</div></div>
</main>
<footer>&copy; TezKhabbar</footer>
<script>
(function(){
const q=new URLSearchParams(location.search);
const title=q.get('title')||'', date=q.get('date')||'';
document.getElementById('t').textContent=title;
document.getElementById('d').textContent=date;
if(title)document.title=title+' - TezKhabbar';
document.getElementById('back').onclick=()=>{history.length>1?history.back():location.href='/';};
const re=/^\/(uploads\/[^\s"'<>\\]+|image\d\.(png|jpg))$/i;
const imgs=q.getAll('img').filter(u=>re.test(u)).slice(0,8);
const wrap=document.getElementById('pages'), jump=document.getElementById('jump');
if(!imgs.length){document.getElementById('msg').textContent='Image not found.';return;}
wrap.textContent='';
imgs.forEach((src,i)=>{
  const pg=document.createElement('div');pg.className='page';pg.id='p'+(i+1);
  const lb=document.createElement('div');lb.className='plabel';
  const sp=document.createElement('span');sp.textContent=imgs.length>1?'Page '+(i+1)+' of '+imgs.length:'';
  const op=document.createElement('a');op.href=src;op.target='_blank';op.rel='noopener';op.textContent='Open full size';
  lb.append(sp,op);
  const st=document.createElement('div');st.className='stage';
  const el=new Image();el.alt=title+' '+(i+1);el.src=src;el.onclick=()=>st.classList.toggle('zoom');
  st.appendChild(el);pg.append(lb,st);wrap.appendChild(pg);
  if(imgs.length>1){const a=document.createElement('a');a.className='btn chip';a.href='#p'+(i+1);a.textContent=i+1;jump.insertBefore(a,jump.lastChild);}
});
})();
</script>
</body></html>
